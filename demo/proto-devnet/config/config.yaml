Protocol: Cardano
ByronGenesisFile: byron-genesis.json
ShelleyGenesisFile: shelley-genesis.json
AlonzoGenesisFile: alonzo-genesis.json
ConwayGenesisFile: conway-genesis.json
DijkstraGenesisFile: dijkstra-genesis.json

# The override sizes the PATIENT lane. Ten 3 MB endorser-block budgets give it
# the same ~30 MB admission space as the independently-sized urgent lane.
MempoolCapacityBytesOverride: 30000000
# Mempool diffusion timeouts: the node wants the trio all-set or all-unset.
# Soft/hard keep their defaults; the CAPACITY is the demo knob — the lanes
# split it 1/4 urgent / 3/4 patient (Lanes.laneTimeoutCapacity).
MempoolTimeoutSoft: 1
MempoolTimeoutHard: 1.5
MempoolTimeoutCapacity: 60

# Needed < 10.6
EnableP2P: true

LastKnownBlockVersion-Alt: 0
LastKnownBlockVersion-Major: 3
LastKnownBlockVersion-Minor: 1
ConsensusMode: GenesisMode
RequiresNetworkMagic: RequiresMagic
LedgerDB:
  Backend: V2InMemory
  NumOfDiskSnapshots: 2
  QueryBatchSize: 100000
  SnapshotInterval: 4230
PeerSharing: false
SyncTargetNumberOfActivePeers: 15
SyncTargetNumberOfEstablishedPeers: 40
TargetNumberOfActivePeers: 15
TargetNumberOfEstablishedPeers: 40

ExperimentalProtocolsEnabled: true
ExperimentalHardForksEnabled: true
TestShelleyHardForkAtEpoch: 0
TestAllegraHardForkAtEpoch: 0
TestMaryHardForkAtEpoch: 0
TestAlonzoHardForkAtEpoch: 0
TestBabbageHardForkAtEpoch: 0
TestConwayHardForkAtEpoch: 0
TestDijkstraHardForkAtEpoch: 0

TurnOnLogMetrics: true
TurnOnLogging: true
UseTraceDispatcher: true
TraceOptionNodeName: node0
TraceOptionMetricsPrefix: cardano.node.metrics.
TraceOptionForwarder:
  connQueueSize: 64
  disconnQueueSize: 128
  maxReconnectDelay: 30
TraceOptionPeerFrequency: 2000
TraceOptionResourceFrequency: 1000
TraceOptions:
  '':
    backends:
    - Stdout MachineFormat
    - PrometheusSimple 0.0.0.0 12900
    detail: DNormal
    severity: Notice
  BlockFetch.Client:
    severity: Debug
  BlockFetch.Client.CompletedBlockFetch:
    maxFrequency: 2.0
  BlockFetch.Decision:
    severity: Notice
  BlockFetch.Remote:
    severity: Notice
  BlockFetch.Remote.Serialised:
    severity: Notice
  BlockFetch.Server:
    severity: Debug
  BlockchainTime:
    severity: Notice
  ChainDB:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation:
    severity: Debug
  ChainDB.AddBlockEvent.AddBlockValidation.ValidCandidate:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToQueue:
    maxFrequency: 2.0
  ChainDB.AddBlockEvent.AddedBlockToVolatileDB:
    maxFrequency: 2.0
  ChainDB.CopyToImmutableDBEvent.CopiedBlockToImmutableDB:
    maxFrequency: 2.0
  ChainDB.LedgerEvent.Flavor.V1.OnDisk.BackingStoreEvent:
    severity: Silence
  ChainDB.LedgerEvent.Forker:
    severity: Silence
  ChainDB.ReplayBlock.LedgerReplay:
    severity: Notice
  ChainSync.Client:
    severity: Debug
  ChainSync.Local:
    severity: Silence
  ChainSync.Remote:
    severity: Notice
  ChainSync.Remote.Serialised:
    severity: Notice
  ChainSync.ServerBlock:
    severity: Notice
  ChainSync.ServerHeader:
    severity: Debug
  Consensus.GSM:
    severity: Info
  Forge.Loop:
    severity: Debug
  Forge.StateInfo:
    severity: Debug
  LedgerMetrics:
    severity: Info
  Mempool:
    severity: Notice
  Mempool.AddedTx:
    # node1's live projection consumes the compact txid + aggregate-size trace.
    severity: Info
  Mempool.RemoveTxs:
    severity: Info
    detail: DDetailed
  Mempool.RejectedTx:
    # The feeder receives the submission result directly. Emitting the complete
    # transaction here turns expected parent-wait retries into ~80 KB log lines
    # and can outrun the live trace reader during saturation scenarios.
    severity: Silence
  Mempool.AttemptAdd:
    severity: Silence
  Mempool.LedgerFound:
    severity: Silence
  Mempool.LedgerNotFound:
    severity: Silence
  Mempool.SyncNotNeeded:
    severity: Silence
  Mempool.Synced:
    severity: Silence
  TxSubmission:
    # Per-peer flow-control chatter is emitted several times for every tx under
    # load and is not consumed by any demo projection.
    severity: Notice
  Net:
    severity: Notice
  Net.AcceptPolicy:
    severity: Debug
  Net.ConnectionManager.Local:
    severity: Silence
  Net.ConnectionManager.Remote:
    severity: Debug
  Net.ConnectionManager.Remote.ConnectionManagerCounters:
    severity: Silence
  Net.DNSResolver:
    severity: Notice
  Net.ErrorPolicy:
    severity: Info
  Net.ErrorPolicy.Local:
    severity: Debug
  Net.ErrorPolicy.Remote:
    severity: Debug
  Net.Handshake.Local:
    severity: Silence
  Net.Handshake.Remote:
    severity: Debug
  Net.InboundGovernor:
    severity: Warning
  Net.InboundGovernor.Local:
    severity: Silence
  Net.InboundGovernor.Remote:
    severity: Debug
  Net.InboundGovernor.Transition:
    severity: Debug
  Net.Mux.Local:
    severity: Silence
  Net.Mux.Remote:
    severity: Notice
  Net.PeerSelection:
    severity: Silence
  Net.PeerSelection.Actions:
    severity: Debug
  Net.PeerSelection.Counters:
    detail: DMinimal
    severity: Debug
  Net.PeerSelection.Initiator:
    severity: Notice
  Net.PeerSelection.Responder:
    severity: Notice
  Net.PeerSelection.Selection:
    severity: Debug
  Net.Peers.Ledger:
    severity: Debug
  Net.Peers.List:
    severity: Notice
  Net.Peers.LocalRoot:
    severity: Debug
  Net.Peers.PublicRoot:
    severity: Debug
  Net.Server.Local:
    severity: Silence
  Net.Server.Remote:
    severity: Debug
  Net.Subscription.DNS:
    severity: Debug
  Net.Subscription.IP:
    severity: Debug
  NodeState:
    severity: Notice
  Resources:
    severity: Silence
  Shutdown:
    severity: Notice
  Startup:
    severity: Notice
  Startup.DiffusionInit:
    severity: Debug
  StateQueryServer:
    severity: Notice
  TxSubmission.Local:
    severity: Silence
  TxSubmission.LocalServer:
    severity: Silence
  TxSubmission.MonitorClient:
    severity: Notice
  TxSubmission.Remote:
    severity: Notice
  TxSubmission.TxInbound:
    severity: Notice
  TxSubmission.TxOutbound:
    severity: Notice
  Version.NodeVersion:
    severity: Info
  LeiosNotify.Remote:
    severity: Debug
    maxFrequency: 0
  LeiosFetch.Remote:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosKernel:
    severity: Debug
    maxFrequency: 0
  Consensus.LeiosPeer:
    severity: Debug
    maxFrequency: 0
